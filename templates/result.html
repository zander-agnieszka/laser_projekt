<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Analyse-Ergebnis</title>
    <style>
        body { font-family: sans-serif; text-align: center; }
        .status-io { color: green; }
        .status-nio { color: red; }
        .status-nachbearbeitung { color: orange; }
        .image-container { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        .image-container img { border: 1px solid #ccc; max-width: 30%; height: auto; }
        .image-container p { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Analyse-Ergebnis</h1>
    <h2>Status: <span class="status-{{ status }}">{{ status.upper() }}</span></h2>

    <div class="image-container">
        <div>
            <p>CUT-OUT mit Kontur</p>
            <img src="{{ images.kontur_bild }}" alt="Kontur-Analyse">
        </div>
        <div>
            <p>Maske Reste</p>
            <img src="{{ images.masken_bild }}" alt="Masken-Analyse">
        </div>
    </div>

    <br>
    <a href="/">Zurück zur Startseite</a>
</body>
</html>
